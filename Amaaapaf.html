<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Aama</title>
<style>
  body {
    margin: 0;
    font-family: sans-serif;
    text-align: center;
    background: #ffe6f0;
    color: #333;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    justify-content: center;
    padding: 20px;
    box-sizing: border-box;
  }
  h1 {
    font-size: 28px;
    margin: 10px 0 5px;
  }
  p {
    font-size: 18px;
    margin: 5px 0 15px;
  }
  img.foto {
    width: 220px;
    height: 220px;
    object-fit: cover;
    border-radius: 50%;
    border: 5px solid white;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
  }
  button {
    background: #ff4d88;
    color: white;
    border: none;
    padding: 12px 22px;
    font-size: 18px;
    font-weight: bold;
    border-radius: 30px;
    cursor: pointer;
    margin: 8px;
  }
  button.no {
    background: #999;
  }
  #inicio {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  #juego {
    display: none;
    width: 100%;
    flex-direction: column;
    align-items: center;
  }
  #puntaje {
    font-size: 22px;
    font-weight: bold;
    margin-top: 10px;
    color: #ff2d75;
  }
  #area {
    position: relative;
    width: 320px;
    height: 380px;
    background: white;
    border-radius: 20px;
    overflow: hidden;
    border: 4px solid white;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    margin-top: 10px;
  }
  .objetivo {
    position: absolute;
    width: 90px;
    border-radius: 15px;
    cursor: pointer;
  }
  .malo {
    position: absolute;
    font-size: 48px;
    cursor: pointer;
  }
  #resultado {
    font-size: 20px;
    font-weight: bold;
    margin-top: 10px;
    min-height: 30px;
  }
</style>
</head>
<body>

<div id="inicio">
  <img class="foto" src="./foto.jpg" alt="foto">
  <h1>hola aamaaaa :D</h1>
  <p>Te hice un jueguito</p>
  <button class="si" onclick="empezar()">SI ANDRES TE QUIEDO</button>
  <button class="no" onclick="dijoNo()">NO MOGOLICO</button>
  <p id="msgNo"></p>
</div>

<div id="juego">
  <h1>acaricia a adma!</h1>
  <p>Tocá la adma que aparece, no el 💩</p>
  <div id="puntaje">Puntos: 0 | Tiempo: 30</div>
  <div id="area"></div>
  <p id="resultado"></p>
  <button class="si" onclick="location.reload()">Jugar de nuevo</button>
</div>

<script>
let puntos = 0, tiempo = 30, intervalo, creador;
function dijoNo(){
  document.getElementById('msgNo').innerText = "ya no me keres mala";
}
function empezar(){
  document.getElementById('inicio').style.display = 'none';
  document.getElementById('juego').style.display = 'flex';
  creador = setInterval(crearCosa, 800);
  intervalo = setInterval(()=>{
    tiempo--;
    actualizar();
    if(tiempo <= 0){
      clearInterval(creador);
      clearInterval(intervalo);
      document.getElementById('area').innerHTML = '';
      let msg = puntos > 8 ? "ahnooooo y esta idola de persona" : puntos > 3 ? "exceso de oooaa" : "pancha total";
      document.getElementById('resultado').innerText = "Fin del jueguito. Hiciste " + puntos + " puntos. " + msg;
    }
  }, 1000);
}
function actualizar(){
  document.getElementById('puntaje').innerText = "Puntos: " + puntos + " | Tiempo: " + tiempo;
}
function crearCosa(){
  if(tiempo <= 0) return;
  let area = document.getElementById('area');
  let esBueno = Math.random() > 0.30;
  if(esBueno){
    // ARREGLO: antes era video, ahora es img porque es un GIF
    let v = document.createElement('img');
    v.className = 'objetivo';
    v.src = './aama.gif';
    v.style.left = Math.random() * 70 + '%';
    v.style.top = Math.random() * 65 + '%';
    v.onclick = ()=>{ puntos += 1; v.remove(); actualizar(); };
    area.appendChild(v);
    setTimeout(()=> v.remove(), 1800);
  } else {
    let e = document.createElement('div');
    e.className = 'malo';
    e.innerText = '💩';
    e.style.left = Math.random() * 80 + '%';
    e.style.top = Math.random() * 75 + '%';
    e.onclick = ()=>{ puntos -= 1; e.remove(); actualizar(); };
    area.appendChild(e);
    setTimeout(()=> e.remove(), 1800);
  }
}
</script>
</body>
</html>
